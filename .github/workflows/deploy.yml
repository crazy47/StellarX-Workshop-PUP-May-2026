name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm install
        working-directory: web
      - name: Build with Next.js
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_CONTRACT_ID: CAIXGS2KGMJJP7EXLXGUEGWZ467D4RETLSXUPD25T6U2ZY5IKV5NMRHE
          NEXT_PUBLIC_NFT_CONTRACT_ID: CCBPHDHSBRP2WYZEEKASJF4HY5IEVTCN7CLN6NLHL4I4PNCKLUYTYZOD
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
